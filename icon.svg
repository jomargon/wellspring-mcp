<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>Wellspring for Withings</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <linearGradient id="bodyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="spiritGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="mindGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="layerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <circle cx="256" cy="230" r="160" fill="#0284C7" opacity="0.15" filter="url(#glow)"/>

  <g filter="url(#layerShadow)" transform="translate(0, 8)">
    
    <path d="M 120,200 
             C 120,290 170,350 230,350 
             C 210,320 200,280 200,230 
             C 200,190 220,165 220,165 
             C 160,175 120,200 120,200 Z" 
          fill="url(#bodyGrad)"/>

    <path d="M 392,200 
             C 392,290 342,350 282,350 
             C 302,320 312,280 312,230 
             C 312,190 292,165 292,165 
             C 352,175 392,200 392,200 Z" 
          fill="url(#mindGrad)"/>

    <path d="M 256,120 
             C 256,120 185,220 185,280 
             C 185,319 217,350 256,350 
             C 295,350 327,319 327,280 
             C 327,220 256,120 256,120 Z" 
          fill="url(#spiritGrad)"/>

    <path d="M 256,170 
             C 256,170 215,235 215,275 
             C 215,298 233,316 256,316 
             C 279,316 297,298 297,275 
             C 297,235 256,170 256,170 Z" 
          fill="url(#sparkGrad)" 
          opacity="0.9"/>
          
    <path d="M 140,310 
             Q 256,410 372,310 
             Q 256,370 140,310 Z" 
          fill="url(#spiritGrad)" 
          opacity="0.85"/>
  </g>
</svg>
